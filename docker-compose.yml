services:
  db:
    image: postgres:15-alpine
    container_name: recovery_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recovery_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: recovery_api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/recovery_db
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_mock_key}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_mock_secret}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-secret-admin-token}
      GLOBAL_KILL_SWITCH: ${GLOBAL_KILL_SWITCH:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/Dockerfile.frontend
    container_name: recovery_frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
